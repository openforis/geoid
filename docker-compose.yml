# On-prem / local stack — the SAME app image as Cloud Run.
# `migrate` runs once to head, then `api` serves. NOTE: postgis/postgis:17-3.5 ships
# GEOS 3.9.0, which is NOT Cloud SQL's GEOS 3.11.4 — dedup hashes can differ at edge
# cases across GEOS builds (the golden vectors are pinned to the Cloud SQL stack).

services:
  db:
    image: postgis/postgis:17-3.5
    # The official postgis image has no arm64 manifest; pin amd64 so it runs on
    # Apple Silicon dev hosts (emulated) and amd64 servers (native) alike. (GEOS
    # build here is 3.9.0, not Cloud SQL's 3.11.4 — see the note above.)
    platform: linux/amd64
    environment:
      POSTGRES_USER: geoid
      POSTGRES_PASSWORD: geoid
      POSTGRES_DB: geoid
    ports:
      # Host port is overridable: `GEOID_DB_PORT=5433 docker compose up` if 5432
      # is already taken locally. The API reaches the db over the compose network
      # regardless, so this publish is only for external/manual access.
      - "${GEOID_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoid -d geoid"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    command: ["geoid", "migrate"]
    environment:
      GEOID_DATABASE_URL: postgresql+asyncpg://geoid:geoid@db:5432/geoid
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["geoid", "web"]
    environment:
      GEOID_DATABASE_URL: postgresql+asyncpg://geoid:geoid@db:5432/geoid
      GEOID_BASE_URL: http://localhost:8000
      GEOID_INSTANCE_ID: fao-central
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
